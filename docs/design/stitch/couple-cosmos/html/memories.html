<style>
        body {
            background-color: #0d112a;
            color: #dee0ff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .star-glow {
            filter: drop-shadow(0 0 8px #f4be4e);
        }
        .mint-glow {
            filter: drop-shadow(0 0 8px #45dcc8);
        }
        .coral-glow {
            filter: drop-shadow(0 0 8px #ffb2b7);
        }
        .timeline-line::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            z-index: -1;
        }
        .orbit-animation {
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .stardust-field {
            position: fixed;
            inset: 0;
            pointer-events: none;

<script>
        // Micro-interactions for glass cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Floating particle effect logic can be extended here if needed
        // but current webgl-shader handles the atmospheric background.
