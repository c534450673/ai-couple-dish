<style>
        body {
            background: radial-gradient(circle at top right, #1d192c 0%, #151024 100%);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-sheet {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(69, 220, 200, 0.4); transform: scale(1); }
            70% { box-shadow: 0 0 0 20px rgba(69, 220, 200, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(69, 220, 200, 0); transform: scale(1); }
        }

        .pulse-mint {
            animation: pulse-glow 2s infinite;
        }

        .stardust {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;

</div>

</div>

<!-- Centerpiece Dish -->

</div>

<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-label-sm text-xs">回忆</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-secondary-fixed transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="favorite">favorite</span>
<span class="font-label-sm text-xs">我们</span>
</a>

<script>
        // Simple particle generator for stardust background
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'stardust';
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animation = `pulse-glow ${2 + Math.random() * 4}s infinite ease-in-out`;
            star.style.opacity = Math.random() * 0.5;
            container.appendChild(star);
        }

        // Long press simulation for the feed button
        const feedBtn = document.getElementById('feed-button');
        let pressTimer;

        feedBtn.addEventListener('mousedown', startPress);
        feedBtn.addEventListener('touchstart', startPress);
        feedBtn.addEventListener('mouseup', endPress);
        feedBtn.addEventListener('mouseleave', endPress);
        feedBtn.addEventListener('touchend', endPress);

        function startPress(e) {
            e.preventDefault();
            feedBtn.classList.add('scale-95');
            pressTimer = window.setTimeout(function() {
                // Success trigger
                feedBtn.classList.remove('pulse-mint');
                feedBtn.classList.add('bg-primary-container');
                const icon = feedBtn.querySelector('.material-symbols-outlined');
                icon.textContent = 'star';
                navigator.vibrate && navigator.vibrate([100, 50, 100]);
                alert('✨ 投喂请求已成功跨越星河发送！');
            }, 1000);
        }

        function endPress() {
            feedBtn.classList.remove('scale-95');
            clearTimeout(pressTimer);
        }
    </script>
