<style>
        body {
            background: radial-gradient(circle at top, #1c1535 0%, #151024 100%);
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;

        .glass-card {

            box-shadow: 0 0 30px rgba(255, 93, 115, 0.6), inset -5px -5px 15px rgba(0,0,0,0.3);
            animation: orbit-coral 8s infinite linear;
        }

        .planet-mint {
            background: radial-gradient(circle at 30% 30%, #a2f4e9, #45dcc8);
            box-shadow: 0 0 30px rgba(69, 220, 200, 0.6), inset -5px -5px 15px rgba(0,0,0,0.3);
            animation: orbit-mint 8s infinite linear;
        }

        @keyframes orbit-coral {
            from { transform: rotateY(0deg) translateX(70px) rotateY(0deg); z-index: 10; }
            50% { transform: rotateY(180deg) translateX(70px) rotateY(-180deg); z-index: 0; }
            to { transform: rotateY(360deg) translateX(70px) rotateY(-360deg); z-index: 10; }
        }

        @keyframes orbit-mint {
            from { transform: rotateY(180deg) translateX(70px) rotateY(-180deg); z-index: 0; }
            50% { transform: rotateY(360deg) translateX(70px) rotateY(-360deg); z-index: 10; }
            to { transform: rotateY(540deg) translateX(70px) rotateY(-540deg); z-index: 0; }
        }

        .stardust {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
        
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('stardust-layer');
            const count = 100;
            
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'stardust';
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 2 + 1;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        });

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('ring-2', 'ring-white/10');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('ring-2', 'ring-white/10');
            });
        });
    </script>
