# Python 微服务全量开发/QA 编排。
# 与 docker-compose.fastapi.yml 的迁移期双栈不同，本文件启动 gateway、
# identity/couple、catalog、dining、media、admin、analytics 和 worker 八个
# 独立入口；所有业务容器共享同一个已锁定的 FastAPI 运行镜像。

name: ${PROJECT_NAME:-ai-couple-dish-python}

x-python-build: &python-build
  build:
    context: ../../../backend
    dockerfile: Dockerfile.fastapi

x-python-environment: &python-environment
  APP_ENV: ${APP_ENV:-local}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${MYSQL_DATABASE:-ai_couple_dish}
  DB_USERNAME: ${MYSQL_USER:-aicoupledish}
  DB_PASSWORD: ${MYSQL_PASSWORD:-dev_password}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pass}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must contain at least 64 characters}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must contain at least 64 characters}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be a bcrypt hash}
  FILE_UPLOAD_PATH: /app/uploads
  FILE_BASE_URL: ${FILE_BASE_URL:-http://localhost/api/uploads}
  FILE_PUBLIC_PATH: /api/uploads
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost/api/media/files}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
  RELEASE_SHA: ${RELEASE_SHA:-dev}

x-python-defaults: &python-defaults
  <<: *python-build
  restart: unless-stopped
  environment:
    <<: *python-environment
  networks:
    - python-network

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_couple_dish}
      MYSQL_USER: ${MYSQL_USER:-aicoupledish}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    volumes:
      - python_mysql_data:/var/lib/mysql
      - ../../../backend/src/test/resources/schema-test.sql:/opt/schema-test.sql:ro
      - ./init-python-schema.sh:/docker-entrypoint-initdb.d/01-python-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - python-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pass}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_pass}
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - python_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - python-network

  migration:
    <<: *python-defaults
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      <<: *python-environment
      SCHEMA_DATABASE_URL: ${SCHEMA_DATABASE_URL:-mysql+asyncmy://${MYSQL_USER:-aicoupledish}:${MYSQL_PASSWORD:-dev_password}@mysql:3306/${MYSQL_DATABASE:-ai_couple_dish}?charset=utf8mb4}
    volumes:
      - ../../../backend/alembic.ini:/app/alembic.ini:ro
      - ../../../backend/migrations:/app/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy

  uploads-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "echo event=python_uploads_init_started; mkdir -p /app/uploads; chown -R 10001:10001 /app/uploads; echo event=python_uploads_init_completed result=success"]
    volumes:
      - python_uploads_data:/app/uploads

  gateway:
    <<: *python-defaults
    command: ["uvicorn", "services.gateway.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      <<: *python-environment
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-http://identity:8001}
      GATEWAY_IDENTITY_SERVICE_URL: http://identity:8001
      GATEWAY_CATALOG_SERVICE_URL: http://catalog:8002
      GATEWAY_DINING_SERVICE_URL: http://dining:8003
      GATEWAY_MEDIA_SERVICE_URL: http://media:8004
      GATEWAY_ADMIN_SERVICE_URL: http://admin:8005
      GATEWAY_ANALYTICS_SERVICE_URL: http://analytics:8006
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migration:
        condition: service_completed_successfully

  identity:
    <<: *python-defaults
    command: ["uvicorn", "services.identity_couple.app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  catalog:
    <<: *python-defaults
    command: ["uvicorn", "services.catalog.app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    expose: ["8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migration:
        condition: service_completed_successfully

  dining:
    <<: *python-defaults
    command: ["uvicorn", "services.dining.app.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      <<: *python-environment
      CATALOG_SERVICE_URL: http://catalog:8002
    expose: ["8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      catalog:
        condition: service_healthy

  media:
    <<: *python-defaults
    command: ["uvicorn", "services.media.app.main:app", "--host", "0.0.0.0", "--port", "8004"]
    expose: ["8004"]
    volumes:
      - python_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  admin:
    <<: *python-defaults
    command: ["uvicorn", "services.admin.app.main:app", "--host", "0.0.0.0", "--port", "8005"]
    expose: ["8005"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migration:
        condition: service_completed_successfully

  analytics:
    <<: *python-defaults
    command: ["uvicorn", "services.analytics.app.main:app", "--host", "0.0.0.0", "--port", "8006"]
    expose: ["8006"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migration:
        condition: service_completed_successfully

  worker:
    <<: *python-defaults
    command: ["uvicorn", "services.worker.app.main:app", "--host", "0.0.0.0", "--port", "8007"]
    environment:
      <<: *python-environment
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN:-}
    expose: ["8007"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/api-python-microservices.conf:/etc/nginx/conf.d/api.conf:ro
      - ../../../frontend-h5/dist:/usr/share/nginx/html:ro
      - python_nginx_logs:/var/log/nginx
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - python-network

volumes:
  python_mysql_data:
  python_redis_data:
  python_uploads_data:
  python_nginx_logs:

networks:
  python-network:
    driver: bridge
