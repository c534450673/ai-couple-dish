upstream python_gateway {
    server gateway:8000;
    keepalive 32;
}

map $http_x_request_id $api_request_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format api_safe escape=json
    '{"requestId":"$api_request_id","method":"$request_method","uri":"$uri",'
    '"status":"$status","duration":"$request_time","upstreamStatus":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log api_safe;

    # Gateway 对外只暴露 /health；保留迁移期约定的三个 /api 健康地址，
    # 并在 Nginx 层剥离前缀，避免健康探针被业务鉴权中间件拦截。
    location = /api/health/live {
        proxy_pass http://python_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $api_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /api/health/ready {
        proxy_pass http://python_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $api_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /api/actuator/health {
        proxy_pass http://python_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $api_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://python_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $api_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
