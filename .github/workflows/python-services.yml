name: python-services
on:
  push:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/packages/**"
      - "backend/services/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/data/**"
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/packages/**"
      - "backend/services/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/data/**"
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check packages services tests
      - run: uv run mypy packages services --ignore-missing-imports
