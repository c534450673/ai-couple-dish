<body class="text-on-surface font-body-md min-h-screen pb-32">

</div>

<button class="absolute bottom-4 right-4 px-4 py-2 glass-card rounded-full flex items-center gap-2 text-label-md font-label-md text-white border-white/20 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
                    更换封面
                </button>
</div>
<!-- Basic Info Card -->
<section class="glass-card rounded-[24px] p-5 space-y-5">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-secondary-fixed-dim">星系菜名</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 h-[44px] focus:ring-2 focus:ring-secondary/50 placeholder:text-on-surface-variant/40 text-on-surface" placeholder="给这道菜起个宇宙代号" type="text"/>
</div>
<div class="space-y-2">

</div>
</section>
<!-- Ingredients Card -->

</a>

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-secondary-fixed transition-colors" href="#">
<span class="material-symbols-outlined">favorite</span>
<span class="font-label-sm text-label-md">我们</span>
</a>
</nav>
<script>
        // Micro-interaction: Focus effects for inputs
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.closest('.glass-card').style.borderColor = 'rgba(69, 220, 200, 0.4)';
            });
            el.addEventListener('blur', () => {
                el.parentElement.closest('.glass-card').style.borderColor = 'rgba(255, 255, 255, 0.1)';
            });
        });

        // Floating particles effect
        const createParticle = () => {
            const p = document.createElement('div');
            p.className = 'fixed bg-white rounded-full pointer-events-none opacity-20';
            const size = Math.random() * 3;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.top = `${Math.random() * 100}vh`;
            p.style.transition = `all ${Math.random() * 10 + 5}s linear`;
            document.body.appendChild(p);

            setTimeout(() => {
                p.style.transform = `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`;
                p.style.opacity = '0';
            }, 100);

            setTimeout(() => p.remove(), 15000);
        };

        setInterval(createParticle, 2000);
    </script>
