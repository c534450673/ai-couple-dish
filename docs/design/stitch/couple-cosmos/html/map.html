        .pin-coral { animation: pulse-coral 2s infinite; }
        .pin-mint { animation: pulse-mint 2.5s infinite; }

        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(calc(100% - 140px));
        }
        
        .bottom-sheet.expanded {
            transform: translateY(60px);
        }

            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);

<script>
        // Simple Bottom Sheet Interaction
        const sheet = document.getElementById('memorySheet');
        let isExpanded = false;

        function toggleSheet() {
            isExpanded = !isExpanded;
            if (isExpanded) {
                sheet.classList.add('expanded');
            } else {
                sheet.classList.remove('expanded');
            }
        }

        // Stars Background Animation
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: Math.random() * 0.05
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.opacity += star.speed;
                if (star.opacity > 1 || star.opacity < 0) star.speed *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

        // Drag simulation for sheet
        let startY = 0;
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            if (startY - endY > 50) { // swipe up
                sheet.classList.add('expanded');
                isExpanded = true;
            } else if (endY - startY > 50) { // swipe down
                sheet.classList.remove('expanded');
                isExpanded = false;
            }
        });
    </script>
